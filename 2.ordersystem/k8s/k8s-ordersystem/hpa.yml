# 메트릭 서버 설치
# kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: ordersystem-backend-hpa
  namespace: ljk197
spec: 
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ordersystem-backend #depl_svc.yml과 일치해야 함
  minReplicas: 2 # depl_svc와 hpa중 어느 것이 우선하는가. hpa가 우선임
  maxReplicas: 10
  targetCPUUtilizationPercentage: 30

# 메트릭 서버와 HPA를 통한 pod 현황 조회
# kubectl get hpa ordersystem-backend-hpa -n ljk197 -w

# 부하 간단 테스트
# 특정 pod에 접속
