apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  namespace: ljk197
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-nginx #template, spec.select이 라벨이 일치해야 한다. 
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: ljk197
spec:
  type: ClusterIP
  ports:
  - port: 80 #containerPort: 80 와 동일
    targetPort: 80
  selector:
    app: my-nginx